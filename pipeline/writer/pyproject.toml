[project]
name = "pipeline-writer"
version = "0.1.0"
description = "Pipeline stage 2 — turns trend-radar ranked topics into short narrative drafts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nitin Goswami" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[anthropic]>=0.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[project.scripts]
pipeline-writer = "writer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
