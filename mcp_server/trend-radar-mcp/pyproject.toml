[project]
name = "trend-radar"
version = "0.1.0"
description = "MCP server that surfaces trending AI/ML topics from Reddit, HN, arXiv, and HF Daily Papers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nitin Goswami" }]

dependencies = [
    # MCP protocol layer
    "mcp>=2.0.0",
    # Data contract
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # HTTP + adapters (used from phase 2 onward, declared now so `uv sync` is one-shot)
    "httpx>=0.27",
    "feedparser>=6.0",
    # Storage
    "aiosqlite>=0.20",
    # Clustering fallback
    "rapidfuzz>=3.9",
    # LLM normalizer (graceful no-op if ANTHROPIC_API_KEY absent)
    "pydantic-ai-slim[anthropic]>=0.0.14",
]

[project.optional-dependencies]
observability = ["logfire>=0.51"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "anyio>=4.4",
]

[project.scripts]
trend-radar = "trend_radar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_radar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
